  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="keywords" content="energy efficient windows, window replacement, triple pane windows, casement windows, double hung windows, architectural windows, thermal insulation">
  <meta property="og:title" content="Register Account — Vitrava Client Installation Portal | Vitrava Windows">
  <meta property="og:description" content="Create your Vitrava customer account to manage your window replacement project and documents.">
  <meta property="og:type" content="website">

</head>
<body class="auth-page">
  <a class="portal-skip-link" href="#main-content">Skip to main content</a>
      <div class="auth-utilities no-print" role="group" aria-label="Display settings">
        <button type="button" class="btn btn-secondary btn-icon" data-action="toggle-theme" aria-label="Toggle color theme" title="Toggle Light/Dark Theme">
          <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button type="button" class="btn btn-secondary btn-icon" data-action="toggle-rtl" aria-label="Toggle text direction" title="Toggle LTR/RTL Layout">
          <span class="rtl-btn-text">RTL</span>
        </button>
      </div>
  <main id="main-content">
    
  <section class="auth-card auth-card--register" aria-labelledby="auth-title">
    <a href="index.html" class="site-brand" aria-label="Vitrava Home 01">
      <svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="2" width="32" height="32" rx="6" fill="#087D8C"/>
    <rect x="6" y="6" width="10" height="10" rx="2" fill="#DDEFEA"/>
    <rect x="20" y="6" width="10" height="10" rx="2" fill="#DDEFEA"/>
    <rect x="6" y="20" width="10" height="10" rx="2" fill="#DDEFEA"/>
    <rect x="20" y="20" width="10" height="10" rx="2" fill="#D8EC8C"/>
    <line x1="18" y1="2" x2="18" y2="34" stroke="#17272E" stroke-width="2"/>
    <line x1="2" y1="18" x2="34" y2="18" stroke="#17272E" stroke-width="2"/>
  </svg>
      <span class="site-brand__text">
        <span class="site-brand__name">VITRAVA</span>
        <span class="site-brand__tagline">Smarter Windows</span>
      </span>
    </a>
    <div class="auth-card__intro">
      <p class="auth-card__eyebrow">New homeowner</p>
      <h1 id="auth-title">Create your portal account</h1>
      <p class="auth-card__description">Manage your window project, from your first measurement to your warranty.</p>
    </div>
    <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-name" class="form-label">Full Name *</label>
            <input type="text" id="reg-name" autocomplete="name" class="form-input" placeholder="e.g. Eleanor Vance" minlength="3" required>
          </div>

          <div class="auth-form-grid">
            <div class="form-group">
              <label for="reg-email" class="form-label">Email Address *</label>
              <input type="email" id="reg-email" autocomplete="email" class="form-input" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
              <label for="reg-phone" class="form-label">Phone Number *</label>
              <input type="tel" id="reg-phone" autocomplete="tel" class="form-input" placeholder="10-digit phone number" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
            </div>
          </div>

          <div class="auth-form-grid"><div class="form-group">
            <label for="reg-password" class="form-label">Create Password *</label>
            <input type="password" id="reg-password" autocomplete="new-password" class="form-input" placeholder="Min. 8 characters" required>
            <span class="form-hint">At least 8 characters with letters and numbers.</span>
          </div><div class="form-group">
            <label for="reg-password-confirm" class="form-label">Confirm Password *</label>
            <input type="password" id="reg-password-confirm" autocomplete="new-password" class="form-input" placeholder="Repeat password" required>
          </div></div>

          <div class="form-group" style="margin-top: 1rem;">
            <label class="custom-checkbox">
              <input type="checkbox" id="reg-terms" required>
              <span>I agree to the Vitrava Terms of Service and Privacy Policy.</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary auth-card__submit">Create Account &rarr;</button>
        </form>
    <p class="auth-card__switch">Already have an account? <a class="auth-card__link" href="login.html">Sign in</a></p>
  </section>
  
  </main>
  
  <script src="./assets/js/theme.js"></script>
  <script src="./assets/js/portal.js"></script>
  <script src="./assets/js/main.js"></script>
</body>
</html>
